<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Accordion Tools</title>
    <meta
      name="description"
      content="Free browser tools for accordion players: find Stradella chords and scales, explore harmony, plan progressions, and play bass patterns and ABC tunes on an interactive diagram."
    />
    <!-- The browser bar follows the interface colours (--ui-bg in src/styles/tokens.css). -->
    <meta name="theme-color" content="#f6f7fb" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#10141c" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="canonical" href="https://gilsag.github.io/Accordion-Tools/" />

    <!-- Link previews. Crawlers need absolute URLs; the image is public/social-preview.png. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Accordion Tools" />
    <meta property="og:title" content="Accordion Tools" />
    <meta
      property="og:description"
      content="Find Stradella chords and scales, explore harmony and practice with an interactive accordion diagram. Free, in the browser."
    />
    <meta property="og:url" content="https://gilsag.github.io/Accordion-Tools/" />
    <meta
      property="og:image"
      content="https://gilsag.github.io/Accordion-Tools/social-preview.png"
    />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="The Stradella bass diagram with E minor seventh played as an E counterbass and a G major chord button."
    />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
